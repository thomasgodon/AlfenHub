name: Build and publish Docker image

# Tagging:
#   push to main (code changes only)  -> :unstable
#   workflow_dispatch                 -> :unstable
#   published GitHub release          -> :<semver> + :latest
on:
  push:
    branches: [main]
    # Only paths that end up in the image. Tests, docs and CI config do not trigger a build.
    paths:
      - 'AlfenHub/**'
      - 'AlfenHub.Domain/**'
      - 'AlfenHub.Application/**'
      - 'AlfenHub.Infrastructure/**'
      - 'AlfenHub.sln'
      - 'Dockerfile'
      - '.dockerignore'
  release:
    types: [published]
  workflow_dispatch:

# A newer push to main supersedes an in-flight unstable build; release builds never cancel.
concurrency:
  group: docker-${{ github.event_name == 'release' && github.ref || 'unstable' }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},enable=${{ github.event_name == 'release' }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}
            type=raw,value=unstable,enable=${{ github.event_name != 'release' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
